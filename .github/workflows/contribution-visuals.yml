name: Generate Contribution Visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: zynx095
          github_token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          outputs: |
            github-contribution-grid-snake.svg?palette=github-light
            github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          USERNAME: zynx095

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-contribution-grid-snake.svg
          git add github-contribution-grid-snake-dark.svg
          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution visuals"
            git push
          fi
